[package]
name = "odm-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Core multi-connection HTTP download engine for ODM (Open Download Manager)"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies", "socks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util", "process"] }
tokio-util = "0.7"
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rand = "0.8"
url = "2"
m3u8-rs = "6"
quick-xml = { version = "0.36", features = ["serialize"] }

[dev-dependencies]
axum = "0.7"
tempfile = "3"
